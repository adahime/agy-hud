[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-hud"
version = "1.0.0"
description = "Real-time Token/s, TTFT, raw model ID, and context window HUD for Google Antigravity (Desktop Pill, CLI & Native Side-Pane Plugin)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "AGY-HUD Contributors" }
]
keywords = [
    "antigravity",
    "google-antigravity",
    "token-speed",
    "tps",
    "ttft",
    "hud",
    "context-window",
    "telemetry"
]

[project.scripts]
agy-hud = "desktop.cli:main"
